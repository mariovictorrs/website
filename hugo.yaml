baseURL: https://mariovictor.dev/
defaultContentLanguage: pt-br
locale: "pt-BR"
title: Mário Victor

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [HTML,RSS]

menu:
  main:
    - name: Contribuições
      pageRef: /contribuicoes
      weight: 1
    - name: Experiência
      pageRef: /experiencia
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/mariovictorrs"
      params:
        icon: github

# Parse Git commit
enableGitInfo: true

params:
  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  footer:
    displayCopyright: true
    displayPoweredBy: false
